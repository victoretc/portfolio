<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Класс .js ставим до первой отрисовки: иначе текст первого экрана
     мигнёт (виден → скрыт → появляется). Без JS страница остаётся живой. -->
<script>document.documentElement.classList.add('js');</script>
<title>{{ if .IsHome }}{{ site.Title }} — сайты, которые приносят заявки{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ .Description | default site.Params.description }}">
<meta property="og:title" content="{{ if .IsHome }}{{ site.Title }} — сайты, которые приносят заявки{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}">
<meta property="og:description" content="{{ .Description | default site.Params.description }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
{{ with .Permalink }}<link rel="canonical" href="{{ . }}">{{ end }}
<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">
<!-- Шрифт свой (SIL OFL): Onest — заголовок, дисплей и текст.
     Грузим только кириллицу: она на первом экране, остальное подтянется по мере
     надобности. -->
<link rel="preload" href="{{ "fonts/onest/Onest-cyrillic.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
