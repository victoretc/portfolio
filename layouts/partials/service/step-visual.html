{{- /* Иллюстрации к шагам работы. Номер шага — индекс в partial "service/steps.html". */ -}}
{{- $i := . -}}
{{- if eq $i 0 -}}
<svg viewBox="0 0 220 130" fill="none">
  <rect x="0.75" y="0.75" width="218.5" height="128.5" rx="12" stroke="currentColor" stroke-opacity="0.45"/>
  <path d="M1 27h218" stroke="currentColor" stroke-opacity="0.3"/>
  <circle cx="12" cy="14" r="2" fill="currentColor" fill-opacity="0.45"/>
  <circle cx="19" cy="14" r="2" fill="currentColor" fill-opacity="0.45"/>
  <circle cx="26" cy="14" r="2" fill="currentColor" fill-opacity="0.45"/>
  <rect x="18" y="42" width="112" height="12" rx="3" fill="var(--field-2)"/>
  <rect x="18" y="64" width="166" height="6" rx="3" fill="currentColor" fill-opacity="0.18"/>
  <rect x="18" y="76" width="138" height="6" rx="3" fill="currentColor" fill-opacity="0.18"/>
  <rect x="18" y="96" width="60" height="16" rx="8" fill="var(--ink)" fill-opacity="0.9"/>
  <rect x="142" y="42" width="60" height="70" rx="6" stroke="currentColor" stroke-opacity="0.25"/>
</svg>
{{- else if eq $i 1 -}}
<div class="work-specimen">
  <span class="work-specimen__face">Aa</span>
  <div class="work-specimen__chips">
    <span style="--chip: var(--field-2)"></span>
    <span style="--chip: var(--field-3)"></span>
    <span class="is-accent" style="--chip: var(--accent)"></span>
    <span class="is-ink" style="--chip: var(--ink)"></span>
  </div>
</div>
{{- else if eq $i 2 -}}
<svg viewBox="0 0 240 150" fill="none">
  <rect x="10.75" y="12.75" width="218.5" height="124.5" rx="12" stroke="currentColor" stroke-opacity="0.45"/>
  <path d="M11 38h218" stroke="currentColor" stroke-opacity="0.3"/>
  <circle cx="24" cy="25" r="2.5" fill="currentColor" fill-opacity="0.4"/>
  <circle cx="33" cy="25" r="2.5" fill="currentColor" fill-opacity="0.4"/>
  <circle cx="42" cy="25" r="2.5" fill="currentColor" fill-opacity="0.4"/>
  <rect x="28" y="56" width="42" height="6" rx="3" fill="var(--field-3)"/>
  <rect x="28" y="70" width="58" height="6" rx="3" fill="currentColor" fill-opacity="0.14"/>
  <rect x="28" y="92" width="30" height="6" rx="3" fill="currentColor" fill-opacity="0.2"/>
  <rect x="28" y="106" width="46" height="6" rx="3" fill="currentColor" fill-opacity="0.14"/>
  <path d="M116 62 102 76l14 14" stroke="currentColor" stroke-opacity="0.75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M126 62l14 14-14 14" stroke="currentColor" stroke-opacity="0.75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m126 58-8 36" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/>
</svg>
{{- else if eq $i 3 -}}
<svg class="work-phone" viewBox="0 0 220 300" fill="none">
  <rect x="62" y="18" width="96" height="264" rx="20" stroke="currentColor" stroke-opacity="0.5"/>
  <rect x="95" y="28" width="30" height="5" rx="2.5" fill="currentColor" fill-opacity="0.32"/>
  <rect x="74" y="48" width="72" height="10" rx="3" fill="currentColor" fill-opacity="0.32"/>
  <rect x="74" y="68" width="72" height="6" rx="3" fill="currentColor" fill-opacity="0.16"/>
  <rect x="74" y="80" width="54" height="6" rx="3" fill="currentColor" fill-opacity="0.16"/>
  <rect x="74" y="100" width="72" height="52" rx="6" fill="var(--field-2)" fill-opacity="0.7"/>
  <rect x="74" y="166" width="72" height="6" rx="3" fill="currentColor" fill-opacity="0.16"/>
  <rect x="74" y="178" width="60" height="6" rx="3" fill="currentColor" fill-opacity="0.16"/>
  <rect x="74" y="200" width="72" height="20" rx="10" fill="var(--ink)" fill-opacity="0.9"/>
  <rect x="74" y="236" width="72" height="6" rx="3" fill="currentColor" fill-opacity="0.16"/>
  <rect x="74" y="248" width="44" height="6" rx="3" fill="currentColor" fill-opacity="0.16"/>
  <path d="M46 18v264" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="3 5"/>
  <path d="M42 18h8M42 282h8" stroke="currentColor" stroke-opacity="0.45"/>
  <path d="M186 66v168" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="3 5"/>
  <path d="M182 66h8M182 234h8" stroke="currentColor" stroke-opacity="0.45"/>
</svg>
{{- else if eq $i 4 -}}
<svg viewBox="0 0 220 130" fill="none">
  <rect x="10" y="12" width="172" height="30" rx="15" stroke="currentColor" stroke-opacity="0.45"/>
  <circle cx="28" cy="27" r="6" stroke="currentColor" stroke-opacity="0.6"/>
  <path d="m33 32 5 5" stroke="currentColor" stroke-opacity="0.6"/>
  <path d="M46 27h76" stroke="currentColor" stroke-opacity="0.3"/>
  <rect x="10" y="58" width="26" height="26" rx="6" stroke="currentColor" stroke-opacity="0.3"/>
  <rect x="44" y="60" width="98" height="7" rx="3.5" fill="var(--field-3)"/>
  <rect x="44" y="73" width="150" height="5" rx="2.5" fill="currentColor" fill-opacity="0.16"/>
  <rect x="10" y="96" width="26" height="26" rx="6" stroke="currentColor" stroke-opacity="0.3"/>
  <rect x="44" y="98" width="84" height="7" rx="3.5" fill="currentColor" fill-opacity="0.22"/>
  <rect x="44" y="111" width="126" height="5" rx="2.5" fill="currentColor" fill-opacity="0.14"/>
  <path d="m192 86 8-8 6 5 8-14" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="214" cy="69" r="3" fill="var(--accent)"/>
</svg>
{{- else -}}
<svg viewBox="0 0 240 150" fill="none">
  <path d="M14 126h212" stroke="currentColor" stroke-opacity="0.22" stroke-dasharray="3 5"/>
  <path d="M14 126c34-1 54-8 74-28 18-18 30-24 48-28 24-6 44-24 60-48V126H14Z" fill="var(--accent)" fill-opacity="0.07"/>
  <path d="M14 126c34-1 54-8 74-28 18-18 30-24 48-28 24-6 44-24 60-48" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M14 126c30-2 48-12 64-30" stroke="currentColor" stroke-opacity="0.4" stroke-dasharray="3 5"/>
  <circle cx="196" cy="22" r="7" stroke="var(--accent)" stroke-opacity="0.35"/>
  <circle cx="196" cy="22" r="3" fill="var(--accent)"/>
</svg>
{{- end -}}
