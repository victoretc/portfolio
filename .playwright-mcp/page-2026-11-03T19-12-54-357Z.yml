    - heading [level=3] [ref=f130e163]:
      - strong [ref=f130e164]: Стратегия
    - generic [ref=f130e165]: Погружаемся в рынок, продукт, конкурентов и аудиторию. Находим точки роста и формируем основу, на которой можно принимать сильные дизайн- и бизнес-решения.
  - generic [ref=f130e182]:
    - heading "Концепция" [level=3] [ref=f130e184]
    - generic [ref=f130e185]: "Определяем позиционирование бренда: чем он отличается, для кого существует и почему его должны выбрать. Переводим сложные идеи в ясное и убедительное сообщение."
  - generic [ref=f130e201]:
    - heading "Брендинг" [level=3] [ref=f130e203]
    - generic [ref=f130e204]: "Создаём визуальную систему, которая узнаётся и масштабируется: логотип, типографика, цвет, графика, правила коммуникации и носители бренда."
  - generic [ref=f130e220]:
    - heading "UX/UI-дизайн" [level=3] [ref=f130e222]
    - generic [ref=f130e223]: Проектируем сайты и цифровые продукты вокруг реальных пользовательских сценариев. Убираем лишнее, выстраиваем понятную логику и превращаем интерфейс в инструмент бизнеса.
  - generic [ref=f130e239]:
    - heading "Разработка" [level=3] [ref=f130e241]
    - generic [ref=f130e242]: Переносим дизайн в работающий цифровой продукт, сохраняя задумку до пикселя. Продумываем адаптивность, скорость, анимацию, CMS и техническую устойчивость.
  - generic [ref=f130e258]:
    - heading "SEO" [level=3] [ref=f130e260]
    - generic [ref=f130e261]: "Закладываем основу для органического роста: структура, техническая оптимизация, контентные точки входа и понятная аналитика."
  - generic [ref=f130e277]:
    - heading "AI" [level=3] [ref=f130e279]
    - generic [ref=f130e280]: Встраиваем AI там, где он действительно экономит время, улучшает сервис или помогает масштабировать процессы — без технологии ради технологии.
  - generic [ref=f130e296]:
    - heading "Поддержка" [level=3] [ref=f130e298]
    - generic [ref=f130e299]: После запуска не исчезаем. Развиваем продукт, тестируем гипотезы, улучшаем интерфейсы и помогаем бренду оставаться цельным по мере роста.
