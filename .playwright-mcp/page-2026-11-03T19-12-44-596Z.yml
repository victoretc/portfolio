      - 'heading "Что выгоднее в Бресте: лендинг под ключ или сайт на конструкторе" [level=3] [ref=f128e198]'
      - paragraph [ref=f128e199]: "Считаем для бизнеса Бреста Брестской области: подписка на конструктор кажется дешевле — 15–60 рублей в месяц, но за 2–3 года это 500–2000 рублей за шаблон, который нельзя вынести с платформы. Лендинг под ключ стоит от 500 рублей разово и остаётся у вас навсегда: код, дизайн, контент и домен — собственность компании. По скорости студия тоже выигрывает: от 5 дней до запуска против недель освоения конструктора, где мобильная версия и скорость загрузки зависят от ваших рук. Скрытая экономия — в конверсии: уникальный дизайн под компаний Бреста продаёт лучше типовой сетки, а чистая вёрстка и мета-теги с первого дня дают рекламе и поиску нужный материал. Вывод для компаний Бреста: конструктор годится для страницы-визитки на неделю, лендинг — для бизнеса, который собирает заявки и растёт. Плюс поддержка: после запуска сайт ведёт студия по договору — правки, резервные копии и консультации не требуют отдельного IT-сотрудника в штате."
      - 'heading "Сроки разработки сайта в Бресте: от брифа до запуска" [level=3] [ref=f128e200]'
      - paragraph [ref=f128e201]: "Для бизнеса Бреста Брестской области график выглядит так: лендинг — от 5 рабочих дней, корпоративный сайт — 4–8 недель, интернет-магазин — от 6 недель. Первый день — бриф: формат, цели, примеры. Затем два-три дня на анализ конкурентов и техзадание, до пяти дней на дизайн и правки, после — вёрстка, программирование и наполнение контентом. Цену и дату сдачи фиксирует договор, подписываемый до начала работ, — проекты Бреста не двигаются месяцами из-за «непредвиденных сложностей». Ускоряют три вещи: подготовленные тексты и фото, оперативная связь в Telegram или Viber, заранее согласованные референсы. Когда контента нет, его закрывает студия: копирайтер пишет тексты, изображения берутся из лицензионных стоков. Если сайт нужен к конкретной дате — выставке или запуску рекламы, — график планируется от дедлайна, и каждый этап имеет своего владельца со стороны студии. Перед сдачей сайт проходит проверку форм и адаптива на реальных устройствах: запускается только рабочая версия."
      - 'heading "Состав работ: что получает заказчик сайта в Бресте" [level=3] [ref=f128e202]'
      - paragraph [ref=f128e203]: "Заказчик Бреста получает сайт «под ключ» — без доплат за каждый шаг. Состав работ: анализ ниши и конкурентов, прототип, техзадание, уникальный дизайн с адаптивом под смартфоны, вёрстка, программирование, наполнение разделов контентом, базовая SEO-настройка (мета-теги, ЧПУ, robots.txt, sitemap). Функциональный блок: формы заявок с отправкой в CRM или на почту, счётчики аналитики, карты, кнопки мессенджеров. Технологии — по задаче: MODx, 1С-Битрикс, WordPress, OpenCart, PrestaShop, Drupal или разработка на чистом коде. Домен и хостинг в Бресте поможем зарегистрировать и настроить. На финише — инструктаж по админке: тексты и фото менеджер компании меняет сам. Формат для бизнеса Бреста Брестской области — дистанционный: созвоны, переписка, электронный документооборот. В цену входит и безопасность: SSL, антиспам на формах, резервное копирование. Нестандартные функции — выгрузка 1С, онлайн-оплата, личные кабинеты — считаются после брифа отдельной строкой, чтобы смета оставалась прозрачной. После запуска сайт остаётся под наблюдением поддержки: вопросы закрываются в мессенджерах в рабочие часы."
